openapi: 3.0.1
info:
  title: order-management
  version: "0.0"
paths:
  /customers:
    get:
      tags:
        - customers
      operationId: getCustomers
      responses:
        "200":
          description: getCustomers 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      tags:
        - customers
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateDTO"
        required: true
      responses:
        "200":
          description: createCustomer 200 response
  /customers/{id}:
    get:
      tags:
        - customers
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: getCustomer 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    put:
      tags:
        - customers
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateDTO"
        required: true
      responses:
        "200":
          description: updateCustomer 200 response
    delete:
      tags:
        - customers
      operationId: deleteCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: deleteCustomer 200 response
  /customers/{id}/orders:
    get:
      tags:
        - customers
      operationId: getOrders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: getOrders 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /order-items:
    get:
      tags:
        - order-items
      operationId: getOrderItems
      responses:
        "200":
          description: getOrderItems 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderItem"
    post:
      tags:
        - order-items
      operationId: createOrderItem
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dto:
                  $ref: "#/components/schemas/OrderItemCreateDTO"
        required: true
      responses:
        "200":
          description: createOrderItem 200 response
  /order-items/{id}:
    get:
      tags:
        - order-items
      operationId: getOrderItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: getOrderItem 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
    put:
      tags:
        - order-items
      operationId: updateOrderItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemCreateDTO"
        required: true
      responses:
        "200":
          description: updateOrderItem 200 response
    delete:
      tags:
        - order-items
      operationId: deleteOrderItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: deleteOrderItem 200 response
  /order-items/{id}/order:
    get:
      tags:
        - order-items
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: getOrder 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders:
    get:
      tags:
        - orders
      operationId: getOrders_1
      responses:
        "200":
          description: getOrders_1 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      tags:
        - orders
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateDTO"
        required: true
      responses:
        "200":
          description: createOrder 200 response
  /orders/{id}:
    get:
      tags:
        - orders
      operationId: getOrder_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: getOrder_1 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    put:
      tags:
        - orders
      operationId: updateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dto:
                  $ref: "#/components/schemas/OrderCreateDTO"
        required: true
      responses:
        "200":
          description: updateOrder 200 response
    delete:
      tags:
        - orders
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: deleteOrder 200 response
  /orders/{id}/customer:
    get:
      tags:
        - orders
      operationId: getOrderCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: getOrderCustomer 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /orders/{id}/order-items:
    get:
      tags:
        - orders
      operationId: getOrderItems_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: getOrderItems_1 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderItem"
components:
  schemas:
    Customer:
      required:
        - email
        - familyName
        - firstName
      type: object
      properties:
        familyName:
          type: string
        firstName:
          type: string
        email:
          type: string
        id:
          type: integer
          format: int64
          nullable: true
    CustomerCreateDTO:
      type: object
      properties:
        familyName:
          type: string
        firstName:
          type: string
        email:
          type: string
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        dateCreated:
          type: string
          format: date
        address:
          type: string
        paid:
          type: boolean
        delivered:
          type: boolean
        totalAmount:
          type: number
    OrderCreateDTO:
      type: object
      properties:
        dateCreated:
          type: string
          format: date
        address:
          type: string
        paid:
          type: boolean
        delivered:
          type: boolean
        totalAmount:
          type: number
        customerId:
          type: integer
          format: int64
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
    OrderItemCreateDTO:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number